<!doctype html><html><body>
<h1>Campus Tour</h1><div id="cta"></div>
<script>
  // Multi-date event: the button opens a date picker, like Eventbrite's "Check availability".
  setTimeout(() => {
    document.getElementById('cta').innerHTML = '<button id="buy">Check availability</button>';
    document.getElementById('buy').onclick = () => {
      const f = document.createElement('iframe');
      f.src = 'dates-checkout.html'; f.width = 600; f.height = 400;
      document.body.appendChild(f);
    };
  }, 1500);
</script></body></html>
