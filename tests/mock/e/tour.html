<!doctype html><html><body>
<!-- Mirrors Eventbrite's multi-date "Check availability" flow (seen 2026-09-28):
     a "Choose options" dialog in the page itself, the nearest date preselected,
     time slots as plain clickable divs (some "Sold out"), then Tickets appear. -->
<h1>Campus Tour</h1><p>Doors open 9:30 PM - 2 AM</p><div id="cta"></div>
<div id="modal"></div>
<script>
  setTimeout(() => {
    document.getElementById('cta').innerHTML = '<button id="buy">Check availability</button>';
    // Like the real run: the first click lands before the page is ready and does nothing.
    let clicks = 0;
    document.getElementById('buy').onclick = () => { if (++clicks > 1) openModal(); };
  }, 1500);
  function openModal() {
    document.getElementById('modal').innerHTML = `
      <div class="eds-modal">
        <h2>Choose options</h2>
        <button>Date <span>Wed, Sep 30</span></button>
        <section><h3>Time</h3><p>Each option is 2 hours long</p>
          <div class="slot" aria-disabled="true"><span>11:00 am</span> <span>Sold out</span></div>
          <div class="slot" onclick="pick()"><span>1:30 pm</span> <span>Few tickets left</span></div>
          <div class="slot" onclick="pick()"><span>3:30 pm</span></div>
        </section>
        <section id="tickets"><h3>Tickets</h3></section>
        <button aria-label="Close">x</button>
      </div>`;
  }
  function pick() {
    setTimeout(() => {
      document.getElementById('tickets').innerHTML = `<h3>Tickets</h3>General tour
        <button aria-label="Decrease quantity">-</button><span id="n">0</span>
        <button aria-label="Increase quantity" onclick="n.textContent=Math.min(+n.textContent+1,2);
          this.disabled=+n.textContent>=2">+</button>
        <button onclick="document.title='ORDER qty='+n.textContent">Register</button>`;
    }, 600);
  }
</script></body></html>
